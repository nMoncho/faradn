<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Font size</title>
</head>
<!-- CSS font-size maps to GS ! magnification (1x-8x, width and height together).
     Each line should be visibly larger than the one above. -->
<body>
    <center><b>FONT-SIZE</b></center>
    <hr>
    <p>Normal 1x</p>
    <p style="font-size: 200%">200% = 2x</p>
    <p style="font-size: 300%">300% = 3x</p>
    <p style="font-size: 2em">2em = 2x</p>
    <p style="font-size: x-large">x-large</p>
</body>
</html>
