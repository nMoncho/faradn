<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page mode</title>
</head>
<body>
    <!-- A sized, position:relative container becomes an ESC/POS page-mode area;
         its position:absolute children are placed at exact dot positions. -->
    <div style="position: relative; width: 512px; height: 160px">
        <span style="position: absolute; left: 0;    top: 0"><b>PAGE MODE COUPON</b></span>
        <span style="position: absolute; left: 0;    top: 56px">left @ x=0</span>
        <span style="position: absolute; left: 280px; top: 56px">mid @ x=280</span>
        <span style="position: absolute; left: 0;    top: 104px">bottom @ y=104</span>
    </div>
</body>
</html>
