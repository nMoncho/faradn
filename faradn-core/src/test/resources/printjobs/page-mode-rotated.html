<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page mode (rotated)</title>
</head>
<body>
    <!-- transform: rotate(...) on the container sets the ESC/POS print direction
         (ESC T). 180deg keeps the area's shape, so it is the easiest rotation to
         verify by eye: the same coupon should print upside down. -->
    <div style="position: relative; width: 512px; height: 160px; transform: rotate(180deg)">
        <span style="position: absolute; left: 0;    top: 0"><b>ROTATED 180</b></span>
        <span style="position: absolute; left: 0;    top: 56px">left @ x=0</span>
        <span style="position: absolute; left: 280px; top: 56px">mid @ x=280</span>
        <span style="position: absolute; left: 0;    top: 104px">bottom @ y=104</span>
    </div>
</body>
</html>
