<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Margin vs padding</title>
</head>
<!-- margin is OUTSIDE the border (blank paper feed); padding is INSIDE the
     border (blank framed lines). The border makes the difference visible. -->
<body>
    <center><b>MARGIN vs PADDING</b></center>
    <hr>

    <p>1) margin only (space above/below, outside the box):</p>
    <div style="border: 1px solid; margin-top: 40px; margin-bottom: 40px">
        <p>Box with margin only.</p>
    </div>

    <p>2) padding only (blank framed lines, inside the box):</p>
    <div style="border: 1px solid; padding: 30px">
        <p>Box with padding only.</p>
    </div>

    <p>3) both margin and padding:</p>
    <div style="border: 1px solid; margin: 40px; padding: 30px">
        <p>Box with margin and padding.</p>
    </div>

    <p>End of demo.</p>
</body>
</html>
