<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spacing</title>
</head>
<!-- Vertical spacing between blocks via margin-top / margin-bottom, fed as exact
     dots (ESC J). The first two lines are tight (default); the rest have gaps. -->
<body>
    <center><b>SPACING</b></center>
    <hr>
    <p>Line one, tightly packed with the next by default.</p>
    <p>Line two, right below line one.</p>
    <p style="margin-top: 40px">Line three, pushed down 40 dots from line two.</p>
    <p style="margin-top: 40px; margin-bottom: 40px">Line four, with space above and below.</p>
    <p>Line five, right below the space under line four.</p>
</body>
</html>
