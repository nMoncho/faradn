<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Label</title>
</head>
<!-- A sized <body> makes the whole job one fixed-size page-mode label (badge /
     ticket): every element is placed at exact dot positions and the whole area
     prints as one block. -->
<body style="width: 512px; height: 260px">
    <span style="position: absolute; left: 0; top: 0"><b>FARAD'N CONF</b></span>
    <span style="position: absolute; left: 0; top: 64px">Ada Lovelace</span>
    <span style="position: absolute; left: 0; top: 112px">Attendee</span>
    <bar-code style="position: absolute; left: 0; top: 152px" symbology="code128" height="60">ID-0042</bar-code>
</body>
</html>
