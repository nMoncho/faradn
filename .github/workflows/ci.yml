name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: build (Java ${{ matrix.java }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]
        # macOS is pinned to the Intel runner (macos-13): the Apple-Silicon
        # libusb4java native (darwin-aarch64) is not on Maven Central, so an
        # arm64 runner could not resolve it. On Intel the transitive
        # darwin-x86-64 native resolves normally.
        os: [ ubuntu-latest, macos-13 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B --no-transfer-progress clean verify

  format:
    name: formatter check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify formatting
        run: mvn -B --no-transfer-progress net.revelc.code.formatter:formatter-maven-plugin:validate
