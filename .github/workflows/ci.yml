name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: build (Java ${{ matrix.java }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]
        # macOS is pinned to the Intel runner (macos-26-intel): the Apple-Silicon
        # libusb4java native (darwin-aarch64) is not on Maven Central, so an
        # arm64 runner could not resolve it. On Intel the transitive
        # darwin-x86-64 native resolves normally.
        os: [ ubuntu-latest, macos-26-intel ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B --no-transfer-progress clean verify

  format:
    name: formatter & license check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify formatting
        run: mvn -B --no-transfer-progress net.revelc.code.formatter:formatter-maven-plugin:validate
      - name: Verify license headers
        run: mvn -B --no-transfer-progress com.mycila:license-maven-plugin:check
