name: Release

# Tagging v* publishes faradn-core to Maven Central and attaches native binaries to
# the GitHub Release. Requires these repository secrets:
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD  (a Central Portal user token)
#   GPG_PRIVATE_KEY / MAVEN_GPG_PASSPHRASE           (the signing key + its passphrase)
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  publish-central:
    name: Publish faradn-core to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Deploy
        run: mvn -B --no-transfer-progress -Prelease -DskipTests deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  native-binaries:
    name: Native binary (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: faradn-linux-x86_64
          - os: macos-13
            asset: faradn-macos-x86_64
          - os: macos-14
            asset: faradn-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # usb4java 1.3.0 has no darwin-aarch64 native on Maven Central; provide it.
      # Commit the jar under natives/ (built once from libusb4java for Apple Silicon).
      - name: Install Apple Silicon libusb4java native
        if: matrix.os == 'macos-14'
        run: >
          mvn -B install:install-file
          -Dfile=natives/libusb4java-1.3.0-darwin-aarch64.jar
          -DgroupId=org.usb4java -DartifactId=libusb4java -Dversion=1.3.0
          -Dclassifier=darwin-aarch64 -Dpackaging=jar
      - name: Build native binary
        run: mvn -B --no-transfer-progress -Pnative -pl faradn-cli -am -DskipTests package
      - name: Stage asset + checksum
        run: |
          cp faradn-cli/target/faradn "${{ matrix.asset }}"
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
