name: Release

# Tagging v* publishes faradn-core to Maven Central and attaches native binaries to
# the GitHub Release. Requires these repository secrets:
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD  (a Central Portal user token)
#   GPG_PRIVATE_KEY / MAVEN_GPG_PASSPHRASE           (the signing key + its passphrase)
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  publish-central:
    name: Publish faradn-core to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Set release version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing $VERSION (from tag $GITHUB_REF_NAME)"
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.17.1:set \
            -DnewVersion="$VERSION" -DprocessAllModules -DgenerateBackupPoms=false
      - name: Deploy
        # Publish only the parent POM + faradn-core. The CLI/FFI modules ship as
        # native binaries on GitHub Releases, not to Central; keeping them out of
        # the reactor is the reliable way to exclude them, because central-publishing
        # triggers the upload on the LAST reactor module — so maven.deploy.skip /
        # skipPublishing on cli/ffi (which are last) would skip the upload itself.
        run: mvn -B --no-transfer-progress -Prelease -DskipTests -pl .,faradn-core deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  native-binaries:
    name: Native binary (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: faradn-linux-x86_64
            bin: faradn
            lib: libfaradn.so
            libasset: libfaradn-linux-x86_64.so
          - os: macos-26-intel
            asset: faradn-macos-x86_64
            bin: faradn
            lib: libfaradn.dylib
            libasset: libfaradn-macos-x86_64.dylib
          - os: macos-latest
            asset: faradn-macos-aarch64
            bin: faradn
            lib: libfaradn.dylib
            libasset: libfaradn-macos-aarch64.dylib
          - os: windows-latest
            asset: faradn-windows-x86_64.exe
            bin: faradn.exe
            lib: libfaradn.dll
            libasset: libfaradn-windows-x86_64.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # native-image needs the MSVC toolchain on Windows.
      - name: Set up MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      # usb4java 1.3.0 has no darwin-aarch64 native on Maven Central; provide it.
      # Commit the jar under natives/ (built once from libusb4java for Apple Silicon).
      - name: Install Apple Silicon libusb4java native
        if: matrix.os == 'macos-latest'
        run: >
          mvn -B install:install-file
          -Dfile=natives/libusb4java-1.3.0-darwin-aarch64.jar
          -DgroupId=org.usb4java -DartifactId=libusb4java -Dversion=1.3.0
          -Dclassifier=darwin-aarch64 -Dpackaging=jar
      - name: Build native CLI binary
        run: mvn -B --no-transfer-progress -Pnative -pl faradn-cli -am -DskipTests package
      - name: Build shared library
        run: mvn -B --no-transfer-progress -Pnative-shared -pl faradn-ffi -am -DskipTests package
      - name: Stage assets + checksums
        shell: bash
        run: |
          cp "faradn-cli/target/${{ matrix.bin }}" "${{ matrix.asset }}"
          cp "faradn-ffi/target/${{ matrix.lib }}" "${{ matrix.libasset }}"
          # sha256sum exists on Linux and Windows (Git Bash); macOS ships shasum instead.
          # Both emit the same "<hash>  <file>" format.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" "${{ matrix.libasset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" "${{ matrix.libasset }}" > "${{ matrix.asset }}.sha256"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.libasset }}
            ${{ matrix.asset }}.sha256
