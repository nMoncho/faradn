name: Security

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # Re-scan weekly so newly disclosed CVEs in unchanged dependencies still surface.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  dependency-scan:
    name: dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
