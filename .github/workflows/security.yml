name: Security

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # Re-scan weekly so newly disclosed CVEs in unchanged dependencies still surface.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  dependency-scan:
    name: dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
